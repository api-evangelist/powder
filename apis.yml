aid: powder
name: Powder
description: >-
  Powder was a Paris-based gaming company, founded in 2018 and backed by a $14M Series A led by
  Serena with General Catalyst, Slow Ventures, Alven, Bpifrance Digital Venture and Secocha
  Ventures. It built AI-powered clipping software for gamers and content creators: a low-resource
  Windows screen recorder plus on-device machine learning that detected highlight moments in
  gameplay recordings and long Twitch, YouTube and Kick streams and turned them into short
  vertical clips, AutoEdits and automontages, with per-title models for 40-plus games including
  Fortnite, Valorant, Counter-Strike 2 and League of Legends, and NPU-accelerated local inference
  on AMD XDNA hardware. It was distributed as an end-user desktop app through Steam, the Microsoft
  Store and Razer Cortex, on a free tier with a $9.99/month Powder Pro subscription. Powder
  published no public API, developer portal, SDK or machine-readable contract. The company has
  since wound down: its own apex domain now redirects every path to a first-party notice stating
  the app is no longer updated or maintained and that all subscriptions have been cancelled.
